#
# Copy this file into ~/.config/pipewire/filter-chain.conf.d/
# Rekomendasi EQ 6 Band oleh AI
#
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer Sink"
            media.name       = "Equalizer Sink"
            filter.graph = {
                nodes = [
                    # Band 1: Low Shelf (Bass Besar)
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 80.0  "Q" = 0.7  "Gain" = 1.0 }
                    }
                    # Band 2: Peaking (Area Mid Bawah / Boxy)
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.0  "Gain" = 1.0 }
                    }
                    # Band 3: Peaking (Area Vokal Utama)
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.5  "Gain" = 1.0 }
                    }
                    # Band 4: Peaking (Area Presence / Attack)
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 4000.0 "Q" = 1.5  "Gain" = -0.5 }
                    }
                    # Band 5: Peaking (Area Treble / Sibilance)
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 8000.0 "Q" = 2.0  "Gain" = -4.0 }
                    }
                    # Band 6: High Shelf (Udara / Treble Ekstrem)
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_highshelf
                        control = { "Freq" = 10000.0 "Q" = 0.7  "Gain" = -2.5 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                ]
            }
	    audio.channels = 2
	    audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.eq6"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.eq6"
                node.passive = true
            }
        }
    }
]
